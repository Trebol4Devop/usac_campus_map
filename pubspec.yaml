name: usac_campus_map
description: Librería interactiva de mapa y geolocalización para el campus central de la Universidad de San Carlos de Guatemala (USAC).
version: 0.5.1
repository: https://github.com/Trebol4Devop/usac_campus_map
issue_tracker: https://github.com/Trebol4Devop/usac_campus_map/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  assets:
    - assets/geojson/
    - assets/graph/
    - assets/pois/
